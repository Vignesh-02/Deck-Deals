# Nginx reverse proxy for Deck Deals on EC2
# Copy to /etc/nginx/sites-available/deckdeals and enable:
#   sudo cp docs/nginx-deckdeals.conf /etc/nginx/sites-available/deckdeals
#   sudo ln -s /etc/nginx/sites-available/deckdeals /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run: sudo certbot --nginx -d deckdeals.in -d www.deckdeals.in

server {
    listen 80;
    server_name deckdeals.in www.deckdeals.in;
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
